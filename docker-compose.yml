version: "3.8"

services:
  # 1. PostgreSQL Database Service with Persistent Volume
  postgres:
    image: postgres:16-alpine
    container_name: chatbot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-chatbot_platform}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-chatbot_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Main Web & API Dashboard Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatbot_web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_password}@postgres:5432/${POSTGRES_DB:-chatbot_platform}?schema=public
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
      JWT_SECRET: ${JWT_SECRET}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 3. Dedicated Background Message Processing Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatbot_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "scripts/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_password}@postgres:5432/${POSTGRES_DB:-chatbot_platform}?schema=public
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}

volumes:
  postgres_data:
    driver: local
